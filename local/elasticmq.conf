include classpath("application.conf")

node-address {
  protocol = http
  host = sqs
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
}

messages-storage {
  enabled = true
}

queues {
  togglemaster-events {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds

    deadLettersQueue {
      name = "togglemaster-events-dlq"
      maxReceiveCount = 5
    }
  }

  togglemaster-events-dlq {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
  }
}