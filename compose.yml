services:
  auth-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Defina AUTH_DB_PASSWORD no .env}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./auth-service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    image: togglemaster/auth-service:local
    build:
      context: ./auth-service
    environment:
      PORT: "8001"
      DATABASE_URL: postgres://auth_user:${AUTH_DB_PASSWORD:?Defina AUTH_DB_PASSWORD no .env}@auth-db:5432/auth_db?sslmode=disable
      MASTER_KEY: ${MASTER_KEY:?Defina MASTER_KEY no .env}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      auth-db:
        condition: service_healthy

volumes:
  auth-db-data: